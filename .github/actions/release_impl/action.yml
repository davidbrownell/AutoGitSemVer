name: "[impl] Release"
description: "Releases the current repository."

# spell-checker: words jedisct, minisig, minisign, pypi, schneegans

inputs:
  wheel_filename:
    description: "Filename of the Python wheel being released."
    required: true

  package_version:
    description: "Version of the Python package being released."
    required: true

  coverage_total:
    description: "Total code coverage percentage. The code coverage badge will not be updated if this value is empty."
    required: false
    default: ""

  minisign_private_key:
    description: "Key used to sign dist artifacts. No signatures will be created if the key is empty."
    required: false
    default: ""

  pypi_publish_token:
    description: "Token used to publish the package to PyPI."
    required: false
    default: ""

  coverage_badge_gist_token:
    description: "Gist token used to store the code coverage badge."
    required: false
    default: ""

  coverage_badge_gist_id:
    description: "Gist ID used to store the code coverage badge."
    required: false
    default: ""

  coverage_badge_gist_username:
    description: "Gist username used to store the code coverage badge. The current GitHub user will be used if this value is not provided."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv and python
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false # Only standalone tools run here (no project sync), so there is nothing worth caching

    - name: Download Python Package
      uses: actions/download-artifact@v8
      with:
        name: Python package
        path: dist

    - name: Initialize Release Values
      id: release_values
      shell: bash
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
        PACKAGE_VERSION: ${{ inputs.package_version }}
      run: |-
        echo "tag=v${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "badge_filename=${REPOSITORY_NAME}_code_coverage.json" >> "${GITHUB_OUTPUT}"

    - name: Create Repository Tag
      shell: bash
      env:
        TAG: ${{ steps.release_values.outputs.tag }}
      run: |-
        source "${GITHUB_ACTION_PATH}/retry.sh"

        git config user.name "GitHub Action Bot"
        git config user.email "<>"

        git tag --annotate --force -m "Publish Tag" "${TAG}" "${GITHUB_SHA}"
        retry git push origin "${TAG}" --force

    - name: Create Code Coverage Badge
      id: create_code_coverage_badge
      if: ${{ inputs.coverage_badge_gist_token != '' && inputs.coverage_badge_gist_id != '' && inputs.coverage_total != '' }}
      uses: schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ inputs.coverage_badge_gist_token }}
        gistID: ${{ inputs.coverage_badge_gist_id }}
        filename: ${{ steps.release_values.outputs.badge_filename }}
        label: Coverage
        message: ${{ inputs.coverage_total }}%
        valColorRange: ${{ inputs.coverage_total }}
        minColorRange: 50
        maxColorRange: 90

    - name: Display Code Coverage Badge Url
      if: ${{ steps.create_code_coverage_badge.outcome == 'success' }}
      shell: bash
      env:
        GIST_USERNAME: ${{ inputs.coverage_badge_gist_username || github.repository_owner }}
        GIST_ID: ${{ inputs.coverage_badge_gist_id }}
        BADGE_FILENAME: ${{ steps.release_values.outputs.badge_filename }}
        REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |-
        badge="[![Code Coverage](https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/${GIST_USERNAME}/${GIST_ID}/raw/${BADGE_FILENAME})](${REPOSITORY_URL}/actions)"

        echo "**Code Coverage Badge:** ${badge}" >> "${GITHUB_STEP_SUMMARY}"
        echo "**Code Coverage Badge Markdown:** <code>${badge//\[/\\\[}</code>" >> "${GITHUB_STEP_SUMMARY}"

    - name: Sign Artifacts
      if: ${{ inputs.minisign_private_key != '' }}
      shell: bash
      env:
        MINISIGN_PRIVATE_KEY: ${{ inputs.minisign_private_key }}
        TRUSTED_COMMENT: ${{ inputs.wheel_filename }} ${{ steps.release_values.outputs.tag }}
      run: |-
        # The key must not outlive this step, even when signing fails (self-hosted runners persist /tmp).
        key_filename="$(mktemp -p "${RUNNER_TEMP}")"
        trap 'rm -f "${key_filename}"' EXIT
        printf '%s\n' "${MINISIGN_PRIVATE_KEY}" > "${key_filename}"

        cd dist

        echo "**Signed Artifacts:**" >> "${GITHUB_STEP_SUMMARY}"

        uv run --no-project --with py-minisign python - "${key_filename}" "${TRUSTED_COMMENT}" * >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
        import sys

        import minisign

        key_filename, trusted_comment, *filenames = sys.argv[1:]
        key = minisign.SecretKey.from_file(key_filename)

        for filename in filenames:
            key.sign_file(filename, trusted_comment=trusted_comment, drop_signature=True)
            print(f"- {filename} [{filename}.minisig]")
        EOF

    - name: Upload Signatures
      if: ${{ inputs.minisign_private_key != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: Minisign signatures
        path: ./dist/*.minisig

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.release_values.outputs.tag }}
      run: |-
        source "${GITHUB_ACTION_PATH}/retry.sh"

        # Uploading to an existing release lets a rerun recover from a failure in a later step.
        publish_release() {
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" ./dist/* --clobber
          else
            gh release create "${TAG}" ./dist/* --generate-notes
          fi
        }

        retry publish_release

    - name: Publish Python Package
      if: ${{ inputs.pypi_publish_token != '' }}
      shell: bash
      env:
        UV_PUBLISH_TOKEN: ${{ inputs.pypi_publish_token }}
      run: |-
        uv publish --token "${UV_PUBLISH_TOKEN}" --verbose
